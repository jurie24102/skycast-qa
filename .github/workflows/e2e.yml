name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout test suite
        uses: actions/checkout@v4

      # The app under test lives in its own repo — check it out alongside the
      # suite so the static server has something to serve in CI.
      - name: Checkout SkyCast app under test
        uses: actions/checkout@v4
        with:
          repository: jurie24102/skycast
          path: skycast

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E suite
        run: npx playwright test
        env:
          STATIC_ROOT: ./skycast

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
